<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM3100 Scanner</title>
<style>
:root{--bg:#0f141b;--cd:#19212b;--tx:#e8eef5;--mu:#8a98a8;--ac:#f5a623}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Tahoma,sans-serif;max-width:640px;margin:auto;padding:8px 8px 76px}
h1{font-size:17px;margin:6px 2px;color:var(--ac);display:flex;gap:8px;align-items:center}
.c{background:var(--cd);border-radius:12px;padding:10px;margin-bottom:9px}
.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{font-size:12px;color:var(--mu);display:flex;gap:5px;align-items:center}
input,select{background:#0b1016;color:var(--tx);border:1px solid #2c3948;border-radius:8px;padding:6px;width:64px}
select{width:auto}input[type=range]{width:110px;padding:0}input[type=checkbox]{width:auto}
button{background:#2a3748;color:var(--tx);border:0;border-radius:8px;padding:9px 11px;font-size:13px}
button.p{background:var(--ac);color:#111;font-weight:700}
canvas{width:100%;border-radius:10px;background:#0b1016;display:block}
.big{font-size:34px;font-weight:700;color:var(--ac)}.tag{padding:3px 10px;border-radius:20px;font-size:13px;font-weight:700}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav{position:fixed;bottom:0;left:0;right:0;background:#121922;display:flex;justify-content:space-around;padding:6px 0;border-top:1px solid #243040}
nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--mu);padding:4px 6px}
nav button.on{color:var(--ac)}
.scr{display:none}.scr.on{display:block}
.soil{display:flex;gap:6px;flex-wrap:wrap}.soil button{display:flex;flex-direction:column;align-items:center;font-size:10px;width:64px}.soil button.on{outline:2px solid var(--ac)}
#grid{display:grid;gap:1px;font-size:10px;direction:ltr}#grid div{padding:5px 0;text-align:center;border-radius:2px;color:#fff}
.f{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #263243;font-size:13px;gap:4px}
.f span{flex:1}.f button{padding:6px 8px}
html[data-th=light]{--bg:#eef2f6;--cd:#fff;--tx:#14202b;--mu:#5b6b7b}html[data-th=light] input,html[data-th=light] select{background:#f3f6f9}html[data-th=light] button{background:#dde5ee}html[data-th=light] nav{background:#fff}
#lays canvas{margin-bottom:8px}small{color:var(--mu)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="s-scan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M5 12a7 7 0 0 1 14 0M2 12a10 10 0 0 1 20 0M8 20h8"/></symbol>
<symbol id="s-3d" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></symbol>
<symbol id="s-ana" viewBox="0 0 24 24"><path d="M3 20h18M6 16v-5M11 16V6M16 16v-8M21 16v-3"/></symbol>
<symbol id="s-ble" viewBox="0 0 24 24"><path d="M7 7l10 10-5 4V3l5 4L7 17"/></symbol>
<symbol id="s-files" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="s-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></symbol>
<symbol id="k0" viewBox="0 0 24 24"><path d="M3 8l5 3 4-4 4 5 5-3M3 17l6-3 5 4 7-3"/></symbol>
<symbol id="k1" viewBox="0 0 24 24"><circle cx="7" cy="8" r="1.3"/><circle cx="15" cy="7" r="1.3"/><circle cx="11" cy="13" r="1.3"/><circle cx="18" cy="14" r="1.3"/><circle cx="6" cy="17" r="1.3"/></symbol>
<symbol id="k2" viewBox="0 0 24 24"><path d="M3 18l5-9 4 5 3-6 6 10z"/></symbol>
<symbol id="k3" viewBox="0 0 24 24"><path d="M2 9c3-3 5 3 8 0s5 3 8 0 3 0 4 0M2 16c3-3 5 3 8 0s5 3 8 0 3 0 4 0"/></symbol>
<symbol id="k4" viewBox="0 0 24 24"><path d="M2 18c4-8 8-8 10-4s6 2 10-4M2 21h20"/></symbol>
<symbol id="k5" viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 12h16M12 4v16"/></symbol>
</defs></svg>

<div id="msg" class="c" style="display:none"></div>
<h1><svg class="i"><use href="#s-scan"/></svg><span id="ttl"></span></h1>

<!-- 1 LIVE SCAN -->
<section class="scr on" id="p-scan">
 <div class="c">
  <div class="r"><button class="p" onclick="conn()" data-i="connect"></button><button onclick="sim()" data-i="sim"></button><label id="st">-</label></div>
  <div class="r"><span class="big" id="live">0</span><label>nT</label><span class="tag" id="det"></span><label><span data-i="sig"></span>: <b id="sig">0</b></label></div>
  <div class="r"><button onclick="cal()" data-i="cal"></button><label><span data-i="base"></span>: <b id="base">0</b></label></div>
 </div>
 <div class="c">
  <div class="r"><label><span data-i="width"></span>(m)<input id="w" type="number" value="5" step=".5"></label><label><span data-i="length"></span>(m)<input id="l" type="number" value="5" step=".5"></label><label><span data-i="step"></span>(cm)<input id="stp" type="number" value="50"></label><label><span data-i="pulses"></span><input id="pls" type="number" value="5" min="1"></label></div>
  <div class="r"><label><span data-i="start"></span><select id="sd"><option value="left" data-i="left"></option><option value="right" data-i="right"></option></select></label>
   <label><span data-i="pat"></span><select id="pt"><option value="z" data-i="zig"></option><option value="p" data-i="par"></option></select></label>
   <label><span data-i="res"></span><select id="rs"><option>10</option><option selected>12</option><option>14</option><option>16</option></select>bit</label></div>
  <div class="r"><label><span data-i="thr"></span>(nT)<input id="th" type="number" value="150"></label><label><input id="au" type="checkbox"><span data-i="auto"></span> <input id="dw" type="number" value="2" style="width:46px">s</label></div>
  <div class="r"><label><input id="sm" type="checkbox" checked><span data-i="sm"></span></label><label><input id="vb" type="checkbox" checked><span data-i="vb"></span></label><label><span data-i="stab"></span>: <b id="stab">-</b> nT</label></div>
  <div class="r"><label><span data-i="soilT"></span> <span id="soil"></span></label><label><input id="snd" type="checkbox"><span data-i="snd"></span></label></div>
 </div>
 <div class="c">
  <div class="r"><button class="p" onclick="rec()" data-i="rec"></button><button onclick="undo()" data-i="undo"></button><button onclick="nw()" data-i="new"></button><button onclick="save()" data-i="save"></button>
   <label><span data-i="line"></span> <b id="ln">1</b>/<b id="lt">1</b></label></div>
  <canvas id="cv1" width="480" height="480"></canvas>
  <div class="r"><label>min <b id="mn">-</b></label><label>avg <b id="av">-</b></label><label>max <b id="mx">-</b></label></div>
 </div>
</section>

<!-- 2 3D -->
<section class="scr" id="p-3d"><div class="c">
 <div class="r"><button onclick="m3(0)" data-i="surf"></button><button onclick="m3(1)" data-i="grid"></button><button onclick="m3(2)" data-i="lay"></button><button onclick="m3(3)" data-i="heat"></button><button class="p" onclick="m3(4)" data-i="4d"></button></div>
 <div class="r"><label><span data-i="pal"></span><select id="pal" onchange="S.pal=this.value;draw()"></select></label><label><input type="checkbox" id="rev" onchange="draw()"><span data-i="rev"></span></label><label><input type="checkbox" id="hm" onchange="draw()"><span data-i="hmt"></span></label><label><input type="checkbox" id="hv" onchange="draw()"><span data-i="hvd"></span></label><label><input type="checkbox" id="wf" onchange="draw()"><span data-i="wf"></span></label></div>
 <div class="r"><button onclick="cam(1,0.05)" data-i="top"></button><button onclick="cam(0,1)" data-i="front"></button><button onclick="cam(90,1)" data-i="side"></button><button onclick="cam(45,1)" data-i="ang"></button><label><input type="checkbox" id="ar"><span data-i="arot"></span></label></div>
 <div class="r"><label>↻<input type="range" id="yw" min="0" max="360" value="45" oninput="draw()"></label><label><span data-i="interp"></span><select id="ip" onchange="draw()"><option value="2">×1</option><option value="4" selected>×2</option><option value="8">×4</option></select></label></div>
 <div id="c4" style="display:none"><div class="r"><label><span data-i="fs"></span><input type="range" id="fs" min="5" max="90" value="20" oninput="draw()"></label><label><span data-i="dfa"></span><input type="range" id="df" min="2" max="30" value="10" oninput="draw()"></label></div>
 <div class="r"><label><span data-i="nsh"></span><input type="range" id="nsh" min="1" max="6" value="3" oninput="draw()"></label><label><span data-i="clp"></span><input type="range" id="clp" min="0" max="100" value="100" oninput="draw()"></label></div>
 <div class="r"><label><input type="checkbox" id="sol" onchange="draw()"><span data-i="sol"></span></label><label><input type="checkbox" id="frm" checked onchange="draw()"><span data-i="frm"></span></label><label><input type="checkbox" id="bg4" checked onchange="draw()"><span data-i="bgg"></span></label></div><label data-i="n4"></label></div>
 <canvas id="cv3" width="480" height="480"></canvas><div id="grid" style="display:none"></div>
 <div id="lays" style="display:none"><label data-i="ls"></label><canvas id="l0" width="300" height="300"></canvas><label data-i="lm"></label><canvas id="l1" width="300" height="300"></canvas><label data-i="ld"></label><canvas id="l2" width="300" height="300"></canvas></div>
</div></section>

<!-- 3 ANALYSIS -->
<section class="scr" id="p-ana"><div class="c">
 <div class="r" id="fb"></div>
 <div class="r"><button onclick="fundo()" data-i="undo"></button><button onclick="fclr()" data-i="clr"></button><button onclick="saveMod()" data-i="smod"></button></div>
 <div class="r"><label id="fl2"></label></div>
 <div class="r"><label><input type="checkbox" id="fp" onchange="draw()"><span data-i="fp"></span></label><label><input type="checkbox" id="ec" onchange="draw()"><span data-i="ec"></span></label></div>
 <div class="r"><label><span data-i="cf"></span> <input type="range" id="c1" min="0" max="100" value="0" oninput="draw()"><input type="range" id="c2" min="0" max="100" value="100" oninput="draw()"></label></div>
 <div class="r"><label><span data-i="sat"></span> <input type="range" id="sa" min="0" max="100" value="90" oninput="draw()"></label></div>
 <div class="r"><label><span data-i="dref"></span><input id="d0" type="number" value="30">cm @</label><label><input id="a0" type="number" value="500" style="width:70px">nT</label></div>
 <canvas id="cv2" width="480" height="480"></canvas>
 <h4 data-i="targets"></h4><div id="tg"></div><h4 data-i="health"></h4><div id="hl"></div><label data-i="note"></label>
</div></section>

<!-- 4 BLE -->
<section class="scr" id="p-ble"><div class="c">
 <div class="r"><button class="p" onclick="scanDev()" data-i="scand"></button><button onclick="conn()" data-i="connect"></button><button onclick="sim()" data-i="sim"></button><button onclick="disc()" data-i="dcn"></button></div>
 <div class="r"><label id="st2">-</label></div><h4 data-i="devs"></h4><div id="dv"></div><label>Nordic UART · "x,y,z\n" (nT)</label>
</div></section>

<!-- 5 FILES -->
<section class="scr" id="p-files"><div class="c">
 <div class="r"><label><span data-i="sname"></span><input id="sn" style="width:150px"></label></div>
 <div class="r"><button onclick="save()" data-i="save"></button><button onclick="document.getElementById('imp').click()" data-i="imp"></button><button onclick="csv()">CSV</button><button onclick="v3d()" data-i="v3d"></button><button onclick="png()" data-i="png"></button><input type="file" id="imp" accept=".json,.v3d,.csv" style="display:none" onchange="imp(this)"></div>
 <div id="fl"></div>
</div></section>

<!-- 6 SETTINGS -->
<section class="scr" id="p-set"><div class="c">
 <div class="r"><label><span data-i="lang"></span><select id="lg" onchange="lang(this.value)"><option value="ar">العربية</option><option value="en">English</option><option value="fr">Français</option></select></label></div>
 <div class="r"><label><span data-i="theme"></span><select id="thm" onchange="theme(this.value)"><option value="dark" data-i="dark"></option><option value="light" data-i="light"></option></select></label></div>
</div></section>

<nav id="nav"></nav>

<script type="module" src="/main.js"></script>
</body>
</html>
